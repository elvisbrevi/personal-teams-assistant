# Prebuilt binaries for a published release, so `cargo binstall personal-teams-assistant` and the
# one-command installers (scripts/install/install.sh and install.ps1, attached with their digests)
# install in seconds instead of compiling. release.yml calls it once the crate and its GitHub
# release exist; a pull request that changes this file or the installers builds every archive and
# runs each installer against it without uploading anything.
# The archive layout is what [package.metadata.binstall] in Cargo.toml expects. See docs/delivery.md.
name: Binaries

on:
  workflow_call:
    inputs:
      version:
        description: Published version whose GitHub release receives the archives
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/binaries.yml
      - scripts/install/**

permissions: {}

jobs:
  lint:
    name: Installer scripts (lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck (POSIX sh)
        run: shellcheck --shell=sh scripts/install/install.sh scripts/install/test-install.sh
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
          }
          # Write-Host is the scripts' console output; the test driver's helpers are not cmdlets.
          $found = Invoke-ScriptAnalyzer -Path scripts/install -Severity Warning,Error `
            -ExcludeRule PSAvoidUsingWriteHost,PSUseApprovedVerbs,PSUseShouldProcessForStateChangingFunctions,PSUseSingularNouns
          $found | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          if ($found) { exit 1 }

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # One package, one build and one archive name on every target (the host has no window):
        # binstall resolves all four from [package.metadata.binstall]. The oldest supported Linux
        # image keeps the glibc requirement low.
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup target add "$TARGET" && rustc --version
      - name: Release build
        run: cargo build --release --locked --target "$TARGET"
      - name: Archive
        env:
          NAME: personal-teams-assistant
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          dir="$NAME-$TARGET-v$version"
          ext=; [[ "$TARGET" == *windows* ]] && ext=.exe
          mkdir -p dist "$dir"
          cp "target/$TARGET/release/personal-teams-assistant$ext" "target/$TARGET/release/pta$ext" LICENSE README.md "$dir/"
          if [[ "$TARGET" == *windows* ]]; then
            file="$dir.zip"
            7z a -tzip "dist/$file" "$dir" > /dev/null
          else
            file="$dir.tgz"
            tar -czf "dist/$file" "$dir"
          fi
          cd dist
          if command -v sha256sum > /dev/null; then sha256sum "$file"; else shasum -a 256 "$file"; fi > "$file.sha256"
          cat "$file.sha256"
      # The installer the release attaches, run on this operating system against the archive just
      # built: a temporary root and profile, a test source only PTA_INSTALL_TEST=1 accepts, the
      # real login service of the runner's user, then uninstall. The Intel macOS archive runs
      # under Rosetta on the Apple-silicon runner (the test mode names the target).
      - name: Installer (macOS, Linux)
        if: ${{ !contains(matrix.target, 'windows') }}
        env:
          PTA_INSTALL_TEST_TARGET: ${{ matrix.target }}
          # A release already published with archives: the real download path, read-only.
          PTA_INSTALL_TEST_RELEASE: 0.11.1
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$RUNNER_OS" = Linux ]; then
            # A runner has no login session: lingering gives the runner's user its systemd manager.
            sudo loginctl enable-linger "$USER"
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            for _ in $(seq 1 30); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          fi
          sh scripts/install/test-install.sh dist "$version"
      - name: Installer (Windows PowerShell)
        if: ${{ contains(matrix.target, 'windows') }}
        shell: pwsh
        env:
          PTA_INSTALL_TEST_RELEASE: 0.11.1
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/install/test-install.ps1 -Dist dist -Version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Attest and attach to the release
    needs: build
    # A target that failed to build leaves binstall compiling there; the others are still attached.
    if: ${{ !cancelled() && inputs.version != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      # The portal's command fetches these from releases/latest/download, so every release has them.
      - name: Installer scripts and their digests
        run: |
          for file in install.sh install.ps1; do
            cp "scripts/install/$file" "dist/$file"
            (cd dist && sha256sum "$file" > "$file.sha256" && cat "$file.sha256")
          done
      - name: Every archive is for this version
        run: |
          shopt -s nullglob
          ls -l dist
          for file in dist/*.tgz dist/*.zip; do
            case "$file" in *"-v$VERSION".tgz|*"-v$VERSION".zip) ;; *) echo "::error::$file is not for $VERSION"; exit 1 ;; esac
          done
          (cd dist && sha256sum -c ./*.sha256)
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tgz
            dist/*.zip
            dist/install.sh
            dist/install.ps1
      - name: Attach to the GitHub release
        run: gh release upload "v$VERSION" dist/* --clobber --repo "$GITHUB_REPOSITORY"
