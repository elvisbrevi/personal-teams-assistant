name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust
        run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
  headless-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust
        run: rustup show
      - name: Lint headless host and CLI (no Tauri/WebKit)
        run: cargo clippy -p personal-teams-desktop --no-default-features --all-targets --locked -- -D warnings
      - name: Test headless host and CLI
        run: cargo test -p personal-teams-desktop --no-default-features --locked
  desktop:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust
        run: rustup show
      - name: Check desktop GUI and CLI
        run: cargo check -p personal-teams-desktop --locked
      - name: Lint desktop
        if: runner.os == 'macOS'
        run: cargo clippy -p personal-teams-desktop --all-targets --locked -- -D warnings
      - name: Test desktop
        if: runner.os == 'macOS'
        run: cargo test -p personal-teams-desktop --locked
