name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  headless-linux:
    # Library, headless host and CLI: no Tauri/WebKit on Ubuntu.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust
        run: rustup show
      - run: cargo fmt --all --check
      - name: Lint without the GUI
        run: cargo clippy --no-default-features --all-targets --locked -- -D warnings
      - name: Test without the GUI
        run: cargo test --no-default-features --locked
  desktop:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust
        run: rustup show
      - name: Check GUI, host and CLI
        run: cargo check --all-targets --locked
      - name: Lint with the GUI
        if: runner.os == 'macOS'
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test with the GUI
        if: runner.os == 'macOS'
        run: cargo test --locked
