# Pull requests gate on Linux; macOS and Windows run weekly and on platform-sensitive changes, and
# macOS also for a release candidate on main. Pushes to main test, package and audit the release commit.
# Standard GitHub-hosted runners only: free without a minute cap while the repository is public.
# No secrets: pull requests from forks run here too. See docs/delivery.md.
name: CI

on:
  # Pull requests into an epic/ integration branch skip CI; the epic's own pull request into main runs it.
  pull_request:
    branches-ignore: ['epic/**']
  push:
    branches: [main]
  schedule:
    - cron: '37 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a pull request replaces its older run; every commit on main finishes,
  # because the release workflow waits for that commit's result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}
      cloud: ${{ steps.filter.outputs.cloud }}
      macos: ${{ steps.filter.outputs.macos }}
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide which checks this change needs
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          verdict() {
            echo "rust=$1" >> "$GITHUB_OUTPUT"
            echo "ui=$2" >> "$GITHUB_OUTPUT"
            echo "cloud=$3" >> "$GITHUB_OUTPUT"
            echo "macos=$4" >> "$GITHUB_OUTPUT"
            echo "windows=$5" >> "$GITHUB_OUTPUT"
            echo "Rust checks: $1. UI and script checks: $2. Cloud Worker checks: $3. macOS: $4. Windows: $5. Reason: $6." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          # Weekly checks refresh the full matrix and its trusted main-branch caches.
          [ "$EVENT" != schedule ] || verdict true true true true true "weekly full verification"
          # A release candidate runs Linux tests and package verification even without a diff, and
          # macOS (required, in parallel with Linux). Not Windows: it is informative and would delay
          # every publication by its 20 minutes.
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
            code=$(curl -sS -A "personal-teams-assistant-ci (github.com/$GITHUB_REPOSITORY)" -o /dev/null -w '%{http_code}' \
              "https://crates.io/api/v1/crates/personal-teams-assistant/$version" || echo 000)
            [ "$code" = 200 ] || verdict true true true true false "version $version is not on crates.io (HTTP $code), so it will be released"
          fi
          # Any other push to main was already checked on every platform it needed by its pull request.
          if [ "$EVENT" = push ]; then pr_platform=false; else pr_platform=true; fi
          if [ -z "$BASE" ] || [ -z "${BASE//0/}" ] || ! git fetch --quiet --no-tags --depth=1 origin "$BASE"; then
            verdict true true true "$pr_platform" "$pr_platform" "no base commit to compare with"
          fi
          files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          rust=false
          ui=false
          cloud=false
          platform=false
          platform_paths=
          while IFS= read -r file; do
            case "$file" in
              # Not part of the binary or its checks: the landing (Cloudflare publishes it),
              # documentation and agent instructions.
              site/* | docs/* | .agents/* | .claude/* | AGENTS.md | CLAUDE.md | CONTEXT.md | README.md | LICENSE | .gitignore) ;;
              # The account store Worker: its own checks; Workers Builds publishes it.
              cloud/*) cloud=true ;;
              scripts/*) ui=true ;;
              desktop/ui/*) rust=true; ui=true ;;
              .github/*) rust=true; ui=true; cloud=true ;;
              *) rust=true ;;
            esac
            # The one list of platform-sensitive paths: code that differs on macOS or Windows
            # (credential store, process spawning, private-file permissions, update staging and
            # apply, native startup and window), the Windows startup check, the dependency manifest,
            # lock and toolchain, and the workflows. scripts/test-ci-workflow.mjs requires every
            # source file with Windows- or macOS-only code to match it.
            case "$file" in
              Cargo.toml | Cargo.lock | rust-toolchain.toml | build.rs | .github/* | \
              desktop/tauri.conf.json | desktop/Info.plist | desktop/capabilities/* | desktop/icons/* | \
              scripts/test-windows-startup.py | tests/account_authority.rs | \
              src/main.rs | src/bin/* | src/app.rs | src/app/gui.rs | src/app/headless.rs | src/app/control.rs | \
              src/security/* | src/maintenance.rs | src/maintenance/* | src/app/maintenance.rs | src/app/maintenance/* | \
              src/app/cloud/restore.rs | src/consumers.rs | src/app/azure_cli.rs | src/app/github.rs | src/app/github_cli.rs | \
              src/llm/agent.rs | src/llm/implementation.rs | src/llm/implementation/*)
                platform=true
                platform_paths="$platform_paths $file" ;;
            esac
          done <<< "$files"
          if [ "$EVENT" = push ]; then
            verdict "$rust" "$ui" "$cloud" false false "changed paths; on main, macOS runs only for a release candidate"
          elif [ "$platform" = true ]; then
            verdict "$rust" "$ui" "$cloud" true true "changed paths; platform-sensitive:$platform_paths"
          else
            verdict "$rust" "$ui" "$cloud" false false "changed paths; none is platform-sensitive"
          fi

  linux:
    name: Linux
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions agree (Cargo.toml and desktop/tauri.conf.json; --locked checks Cargo.lock)
        run: |
          cargo_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          tauri_version=$(jq -r .version desktop/tauri.conf.json)
          if [ "$cargo_version" != "$tauri_version" ]; then
            echo "::error::Cargo.toml has $cargo_version but desktop/tauri.conf.json has $tauri_version"
            exit 1
          fi
      - name: Tauri 2 system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Linting already gated the PR; main still tests and packages the exact release commit.
      - if: github.event_name != 'push'
        run: cargo fmt --all --check
      - if: github.event_name != 'push'
        run: cargo clippy --locked --all-targets -- -D warnings
      - if: github.event_name != 'push'
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features
      # Builds the .crate exactly as crates.io receives it; the release publishes it without
      # building again.
      - name: Package as crates.io receives it
        run: cargo package --locked

  ui:
    name: UI and scripts
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pinned preview tools; Chromium's cache is keyed by the Playwright version that downloads it.
      PLAYWRIGHT_CORE_VERSION: 1.58.2
      AXE_CORE_VERSION: 4.14.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: GUI syntax
        run: bun build desktop/ui/app.js --no-bundle --outfile "$RUNNER_TEMP/app-check.js"
      - name: GUI logic and translations
        run: node --test scripts/test-activity-ui.cjs scripts/test-ui-i18n.cjs scripts/test-ui-themes.cjs
      - name: Script tests
        run: |
          bun scripts/test-ci-workflow.mjs
          python3 scripts/test-configure-web-access.py
          python3 scripts/test-configure-cloud-access.py
          python3 scripts/test-rehearse-cloud-migration.py
          python3 scripts/test-vps-update.py
      # Playwright and axe-core stay outside the repository, as in docs/ui-design-conventions.md.
      - name: Playwright and axe-core
        run: |
          npm install --prefix "$RUNNER_TEMP/pta-ui-preview" --no-save --no-audit --no-fund \
            "playwright-core@$PLAYWRIGHT_CORE_VERSION" "axe-core@$AXE_CORE_VERSION"
      - name: Restore Playwright's Chromium
        id: chromium
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ env.PLAYWRIGHT_CORE_VERSION }}
      # Chromium downloads only on a cache miss; its system libraries are installed either way.
      - name: Chromium and its system libraries
        env:
          CACHE_HIT: ${{ steps.chromium.outputs.cache-hit }}
        run: |
          playwright="$RUNNER_TEMP/pta-ui-preview/node_modules/.bin/playwright-core"
          if [ "$CACHE_HIT" = true ]; then
            "$playwright" install-deps chromium
          else
            "$playwright" install --with-deps chromium
          fi
      # Only main (the weekly run) saves, so pull requests restore a trusted cache.
      - name: Save Playwright's Chromium
        if: github.ref == 'refs/heads/main' && steps.chromium.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.chromium.outputs.cache-primary-key }}
      - name: GUI preview checks (axe WCAG 2.2 AA and interactions, synthetic data)
        env:
          UI_PREVIEW_DEPS: ${{ runner.temp }}/pta-ui-preview
        run: |
          node scripts/ui-preview/server.mjs "" 4173 &
          for _ in $(seq 50); do curl -fs -o /dev/null http://127.0.0.1:4173/ && break; sleep 0.2; done
          node scripts/ui-preview/check.mjs 4173 "$RUNNER_TEMP/ui-check"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-check
          path: ${{ runner.temp }}/ui-check
          retention-days: 7
          if-no-files-found: ignore

  # The account store Worker (cloud/): type check and tests inside the Workers runtime (Miniflare),
  # with synthetic Access settings. No secrets: Workers Builds deploys from Cloudflare's side.
  cloud:
    name: Cloud Worker
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.cloud == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Type check
        run: bun run check
      - name: Tests in the Workers runtime
        run: bun run test
      - name: Bundle both environments
        run: |
          bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/cloud-production"
          bunx wrangler deploy --dry-run --env staging --outdir "$RUNNER_TEMP/cloud-staging"

  # Required whenever it runs: weekly, on a platform-sensitive change and for a release candidate.
  macos:
    name: macOS
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  windows:
    name: Windows (informative)
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    # Native startup is exercised on platform-sensitive pull requests and weekly, never for a release
    # candidate (it would delay publication and cannot block it); Windows remains informative.
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # A fresh release installation exercises the same linker path as cargo install from crates.io.
      # Keep the build outside the restored target cache; do not patch the resulting PE headers.
      - name: Clean Windows Cargo installation
        run: cargo install --path . --locked --root "$RUNNER_TEMP/pta-windows-install" --target-dir "$RUNNER_TEMP/pta-windows-build"
      - name: Windows PE stack and native GUI lifecycle (Teams stays stopped)
        shell: pwsh
        run: python scripts/test-windows-startup.py "$env:RUNNER_TEMP/pta-windows-install/bin"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-startup
          path: ${{ runner.temp }}/pta-windows-install/*.stderr.log
          retention-days: 7
          if-no-files-found: ignore
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Operator admission and account recovery on Windows
        run: cargo test --locked --no-default-features --test account_authority operator_admission_binding_recovery_and_revocation_preserve_the_original_profile
      - name: Machine sign-in, trust and account management on Windows
        run: |
          cargo test --locked --no-default-features --lib machine_login
          cargo test --locked --no-default-features --lib account_machine_workflow
          cargo test --locked --no-default-features --lib allowed_roots_require
      # The real-host integration tests (tests/account_variables.rs) are Unix-only; these run the
      # platform-neutral and Windows-specific unit tests of the same workflows.
      - name: Account variables, synchronization, migration, updates and readiness on Windows
        run: cargo test --locked --no-default-features --lib -- variables consumers portable standing migration maintenance readiness

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Review dependency changes against GitHub advisories
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          license-check: false
      - name: Scan public history and working files for credentials
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner .
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: security-audit
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Audit locked dependencies against RustSec
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

  # The one check to require before merging: it fails when a required job failed or was
  # cancelled, and passes when the change did not need that job.
  result:
    name: CI result
    if: always()
    needs: [changes, linux, ui, cloud, macos, windows, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Required jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "- \(.key): \(.value.result)"' | tee -a "$GITHUB_STEP_SUMMARY"
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.key != "windows")
            | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::Required jobs did not pass: $failed"
            exit 1
          fi
          windows=$(echo "$NEEDS" | jq -r .windows.result)
          if [ "$windows" != success ] && [ "$windows" != skipped ]; then
            echo "::warning::The Windows build (informative) did not pass: $windows"
          fi
