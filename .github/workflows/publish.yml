name: Publish crate
# Publishes to crates.io when main carries a version that is not published yet.
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: publish-crate
  cancel-in-progress: false
jobs:
  publish:
    # The default `gui` feature needs Tauri; `cargo publish` verifies the package with it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust
        run: rustup show
      - name: Check whether this version is published
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="personal-teams-assistant"))')
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'personal-teams-assistant-ci (github.com/elvisbrevi/personal-teams-assistant)' \
            "https://crates.io/api/v1/crates/personal-teams-assistant/$version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$status" in
            200) echo "publish=false" >> "$GITHUB_OUTPUT"; echo "$version is already on crates.io" ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT"; echo "$version will be published" ;;
            *) echo "crates.io answered HTTP $status"; exit 1 ;;
          esac
      - name: Test before publishing
        if: steps.version.outputs.publish == 'true'
        run: cargo test --locked
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
