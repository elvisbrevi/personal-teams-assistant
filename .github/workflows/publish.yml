name: Publish crate
# Publishes to crates.io when main carries a version that is not published yet.
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: publish-crate
  cancel-in-progress: false
jobs:
  check:
    # A Linux runner answers "is there anything to publish?" so the costlier
    # macOS runner only starts when there is a new version.
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - name: Check whether this version is published
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'personal-teams-assistant-ci (github.com/elvisbrevi/personal-teams-assistant)' \
            "https://crates.io/api/v1/crates/personal-teams-assistant/$version")
          case "$status" in
            200) echo "publish=false" >> "$GITHUB_OUTPUT"; echo "$version is already on crates.io" ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT"; echo "$version will be published" ;;
            *) echo "crates.io answered HTTP $status"; exit 1 ;;
          esac
  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    # The default `gui` feature needs Tauri; `cargo publish` verifies the package with it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust
        run: rustup show
      - name: Test before publishing
        run: cargo test --locked
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
