# Publishes the crate when main carries a version crates.io does not have yet, once CI passed on
# that same commit, then tags it and writes a GitHub release. crates.io's Trusted Publishing
# rejects workflow_run triggers, so this workflow runs on push and waits for CI itself.
# workflow_dispatch retries the head of main (for example after re-running a failed CI).
# See docs/delivery.md.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CRATE: personal-teams-assistant

jobs:
  check:
    name: Version and CI
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.ci.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Is this version on crates.io?
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # crates.io answers 403 without a User-Agent.
          code=$(curl -sS -A "personal-teams-assistant-release (github.com/$GITHUB_REPOSITORY)" -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/$CRATE/$version")
          case "$code" in
            200) echo "published=true" >> "$GITHUB_OUTPUT"
                 echo "$CRATE $version is already on crates.io: nothing to publish." | tee -a "$GITHUB_STEP_SUMMARY" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT"
                 echo "$CRATE $version is not on crates.io yet." ;;
            *) echo "::error::crates.io answered HTTP $code for $CRATE $version"; exit 1 ;;
          esac
      - name: Wait for CI on this commit
        id: ci
        if: steps.version.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          deadline=$(( $(date +%s) + 110 * 60 ))
          while :; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.id) \(.status) \(.conclusion)"')
            if [ -n "$run" ]; then
              read -r id status conclusion <<< "$run"
              [ "$status" = completed ] && break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::CI did not finish on $GITHUB_SHA in time: $CRATE $VERSION is not published"
              exit 1
            fi
            sleep 30
          done
          # The Linux job builds, tests and packages the crate; it must have run, not been skipped.
          linux=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '.jobs[] | select(.name == "Linux") | .conclusion')
          if [ "$conclusion" != success ] || [ "$linux" != success ]; then
            echo "::error::CI run $id concluded '$conclusion' (Linux job: '${linux:-not run}'): $CRATE $VERSION is not published. Fix main, or re-run CI and then this workflow."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "CI run $id passed on $GITHUB_SHA: publishing $CRATE $VERSION." | tee -a "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to crates.io
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Trusted Publishing on crates.io names this workflow (release.yml) and this environment;
    # the environment only accepts main.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc --version
      - name: Short-lived crates.io token (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      # CI already built, tested and packaged (with verification) this exact commit.
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify

  github-release:
    name: Tag and GitHub release
    needs: [check, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Tag v${{ needs.check.outputs.version }} and write its notes
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists."
            exit 0
          fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Personal Teams Assistant $VERSION" --generate-notes
