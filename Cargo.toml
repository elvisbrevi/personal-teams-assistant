[package]
name = "personal-teams-assistant"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Core library and CLI for a personal Microsoft Teams knowledge assistant"
license = "MIT"
readme = "README.md"
include = ["Cargo.toml", "LICENSE", "README.md", "src/**", "static/**", "config.example.toml", "knowledge-map.example.toml", "docs/cli.md", "docs/cli-parity.md"]

[workspace]
members = [".", "desktop/src-tauri"]
default-members = ["."]
resolver = "3"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
aes-gcm-siv = "0.11"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rig-core = "0.32"
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
tiberius = { version = "0.12", default-features = false, features = ["rustls", "tds73"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = "4.2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
