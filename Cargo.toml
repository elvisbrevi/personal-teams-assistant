[package]
name = "personal-teams-assistant"
version = "0.10.7"
edition = "2024"
rust-version = "1.95"
build = "build.rs"
default-run = "personal-teams-assistant"
description = "Personal Microsoft Teams knowledge assistant: desktop tray app, headless host and `pta` CLI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/elvisbrevi/personal-teams-assistant"
# Anchored to the package root: an unanchored "README.md" also matches files in ignored
# local data (e.g. cloned knowledge repositories under data/).
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
    "/build.rs",
    "/src/**",
    "/config.example.toml",
    "/knowledge-map.example.toml",
    "/desktop/tauri.conf.json",
    "/desktop/Info.plist",
    "/desktop/capabilities/**",
    "/desktop/icons/*.png",
    "/desktop/icons/*.ico",
    "/desktop/ui/**",
    "/desktop/skills/**",
]

# `cargo binstall personal-teams-assistant` downloads the archive binaries.yml attaches to the GitHub
# release (macOS and Windows, default features) instead of compiling; elsewhere, or when a release
# has no archive for the target, it compiles like `cargo install`. Third-party builds are not used.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "personal-teams-assistant"
path = "src/main.rs"

[[bin]]
name = "pta"
path = "src/bin/pta.rs"

[features]
# Tray/window GUI. Build with --no-default-features for a headless host (Linux servers):
# no Tauri/WebKit, operated only through `pta`.
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-build", "dep:notify-rust"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs"] }
aes-gcm-siv = "0.11"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2"
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
notify-rust = { version = "4.18.2", optional = true }
tiberius = { version = "0.13", default-features = false, features = ["rustls", "tds73"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = "4.2"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }

# No LTO: cross-crate LTO re-optimizes every dependency once per binary, which tripled the time
# of each update (`cargo install`) for no measurable gain in an I/O-bound application.
[profile.release]
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
