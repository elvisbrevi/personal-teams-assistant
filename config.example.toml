knowledge_map = "knowledge-map.toml"

[server]
bind = "127.0.0.1:3000"
public_url = "https://assistant.example.com"
data_dir = "data"

[graph]
tenant_id = "00000000-0000-0000-0000-000000000001"
client_id = "00000000-0000-0000-0000-000000000002"
user_id = "00000000-0000-0000-0000-000000000003"
# Reception: one subscription to all of the user's chats, or explicit chat IDs.
allowed_chats = []
discover_all_chats = false
# Legacy field, must stay empty: channel scopes are never requested.
channels = []

[llm]
# Legacy single provider: used only when `chain` is empty.
provider = "deepseek"
model = "deepseek-flash"
style = "Natural and clear. Summarize by project and explain what the technical changes suggest. No promises or personal opinions."
# Language the user reads: the app's interface, everything sent to Teams (answers, notices,
# sources) and the activity tasks it drafts: "es" or "en". Overrides any language the style names.
# The CLI, audit log and diagnostics stay in English.
language = "es"

# Every model call starts with the first enabled entry and tries the next only on failure.
# A provider may repeat with a different model or effort (at most 16 entries).
# OpenCode 2 uses provider = "opencode", model = "provider/model", effort = "default".
# Codex, Claude and OpenCode use their installed CLIs and own login;
# DeepSeek calls its API with DEEPSEEK_API_KEY.
[[llm.chain]]
provider = "codex"
model = "gpt-6.1-sol"
effort = "medium"
enabled = true

[[llm.chain]]
provider = "claude"
model = "claude-opus-5-5"
effort = "medium"
enabled = true

[[llm.chain]]
provider = "deepseek"
model = "deepseek-flash"
effort = "max"
enabled = true

[policy]
dry_run = true
greeting = "¡Hola!"
max_context_chars = 16000
# Legacy: kept for compatibility, no longer limits answers.
max_answer_chars = 3000
max_detailed_answer_chars = 8000
max_message_age_seconds = 300
allowed_senders = []
sensitive_patterns = []
# Add business identifiers, customer names and other domain-specific PII patterns.

[secrets]
# Maps secret:// references (used by knowledge-map tools) to credential names stored in the
# system keychain (or NAME / NAME_FILE environment variables). Never values.
# "secret://sqlserver/payments-readonly" = "SQLSERVER_READONLY_CONNECTION_SECRET"
# "secret://azure-devops/reader" = "AZURE_DEVOPS_TOKEN"
# "secret://azure-devops/linker" = "AZURE_DEVOPS_LINK_TOKEN"
# "secret://rabbitmq/monitor" = "RABBITMQ_READONLY_AUTH"
# "secret://internal/status" = "INTERNAL_API_TOKEN"

[activity_registration]
# Save existing Azure tasks locally by day; no models or Azure writes.
enabled = false
auto_register = false # legacy, ignored
daily_hours = 9.0
schedule = "daily" # daily or interval
at = "18:00"
interval_minutes = 60
window_start = "09:00"
window_end = "18:00"
weekdays = [1, 2, 3, 4, 5] # Monday to Sunday = 1 to 7
time_zone = "local" # or an IANA zone, e.g. America/Santiago
sources = [] # Azure source IDs; empty uses all enabled Azure sources
write_source = "" # legacy, ignored
task_kind = "Task" # legacy, task types are discovered from the process
done_state = "Done" # legacy, completed states are discovered from the process
effort_field = "Microsoft.VSTS.Scheduling.CompletedWork" # hours
extra_fields = {} # legacy, ignored
