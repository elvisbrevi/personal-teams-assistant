[package]
name = "personal-teams-desktop"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
build = "build.rs"
default-run = "personal-teams-desktop"
description = "Desktop tray app for a personal Microsoft Teams knowledge assistant"
license = "MIT"
readme = "README.md"
include = ["Cargo.toml", "LICENSE", "README.md", "build.rs", "Info.plist", "tauri.conf.json", "capabilities/**", "icons/*.png", "icons/*.icns", "icons/*.ico", "src/**", "ui/**", "skills/**"]

[[bin]]
name = "pta"
path = "src/bin/pta.rs"

[dependencies]
fs2 = "0.4"
sha2 = "0.10"
anyhow = "1"
axum = "0.8"
chrono = "0.4"
personal-teams-assistant = { version = "0.2.0", path = "../.." }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
url = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
