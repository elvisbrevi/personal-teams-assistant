<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sign in — Personal Teams Assistant</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card panel">
    <div class="brand"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#17382f"/><path d="M14 16h36a3 3 0 0 1 3 3v22a3 3 0 0 1-3 3H27l-9 7v-7h-4a3 3 0 0 1-3-3V19a3 3 0 0 1 3-3z" fill="#fff"/><path d="M23 22h18v5h-6.5v12h-5V27H23z" fill="#17382f"/></svg><div><strong>Teams Assistant</strong><small>Your personal workspace</small></div></div>
    <h1>Sign in</h1>
    <p class="hint">Open your settings, messages and activities on any device.</p>
    <form id="login-form">
      <label>Username<input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" required autofocus></label>
      <label>Password<input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required></label>
      <p id="login-error" class="activity-issue" role="alert"></p>
      <button id="login-submit" type="submit">Sign in</button>
    </form>
    <p class="hint">Use the account provided by your portal operator.</p>
  </main>
</body>
</html>
