# Azure DevOps activity (status questions and activity reviews). Optional link_secret_ref: a
# second credential (PAT with Work Items Read & write), only used to link unregistered work to a
# work item after the user confirms the exact plan in their personal chat. Without it, read-only.
# [[resources]]
# id = "azure-devops-status"
# description = "My Azure DevOps activity: work items, commits, pull requests, pipelines"
# topics = ["azure devops", "activity"]
# enabled = false
# external_processing = false
# allowed_conversations = []
# allowed_senders = []
# kind = "tool"
# [resources.tool]
# type = "azure_devops_status"
# secret_ref = "secret://azure-devops/reader"
# link_secret_ref = "secret://azure-devops/linker"
# The catalog: organizations, projects ("*" = the projects of your teams) and your author email.
# Older maps point to a TOML file in a repository instead (repository + path); never both.
# [[resources.tool.catalog]]
# organization = "https://dev.azure.com/example/"
# projects = ["*"]
# author_email = "me@example.com"

