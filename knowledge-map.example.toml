[repositories]
personal = "../knowledge-repo"

[[resources]]
id = "assistant-operations"
description = "Documentación de operación del asistente: controles, permisos y comportamiento."
topics = ["asistente", "operación", "Teams"]
enabled = true
external_processing = true
# Grant access to the entire conversation, not just the person asking.
# Values: exact conversation "chats/19:..." or "*" (every conversation that reaches the assistant).
allowed_conversations = []
allowed_senders = []
kind = "file"
repository = "personal"
path = "temas/asistente/operacion.md"

