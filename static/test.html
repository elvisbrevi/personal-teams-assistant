<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba del asistente de Teams</title>
<style>
  :root { font-family: system-ui, sans-serif; color-scheme: light; }
  body { max-width: 760px; margin: 2rem auto; padding: 0 1rem; background: #f6f8fb; color: #172333; }
  main { background: white; border-radius: 14px; padding: 1.25rem; box-shadow: 0 2px 14px #0001; }
  h1 { margin-top: 0; font-size: 1.4rem; }
  p { line-height: 1.4; }
  label { display: block; margin: 1rem 0 .35rem; font-weight: 600; }
  input[type=password], textarea { box-sizing: border-box; width: 100%; padding: .75rem; border: 1px solid #9ca9ba; border-radius: 8px; font: inherit; }
  textarea { min-height: 5rem; resize: vertical; }
  .options { display: flex; gap: 1rem; flex-wrap: wrap; margin: .8rem 0; }
  .options label { display: inline; margin: 0; font-weight: 400; }
  button { background: #315da8; color: white; border: 0; border-radius: 8px; padding: .7rem 1rem; font: inherit; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  #history { margin: 1.2rem 0; display: grid; gap: .7rem; }
  .turn { padding: .8rem; border-radius: 9px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .you { background: #e8efff; }
  .assistant { background: #ebf5ee; }
  .quiet { background: #fff3da; }
  small { color: #4f5b6a; }
</style>
<main>
  <h1>Probar el asistente de Teams</h1>
  <p>Simula un chat. Usa las mismas fuentes y decisiones que Teams, pero las respuestas aparecen aquí y <strong>nunca se envían a Teams</strong>.</p>
  <label for="key">Clave de administración</label>
  <input id="key" type="password" autocomplete="off" required>
  <div id="history" aria-live="polite"></div>
  <form id="chat">
    <label for="message">Mensaje</label>
    <textarea id="message" maxlength="2000" required placeholder="Hola Elvis, ¿cuál es el avance de tus HUs esta semana?"></textarea>
    <div class="options">
      <label><input id="group" type="checkbox"> Simular grupo</label>
      <label><input id="mention" type="checkbox" checked> Mencionar a Elvis</label>
    </div>
    <button id="send">Enviar en simulación</button>
  </form>
  <p><small>La clave permanece en esta página mientras esté abierta. Cerrar o recargar inicia una conversación nueva.</small></p>
</main>
<script src="/test/app.js" defer></script>
</html>
